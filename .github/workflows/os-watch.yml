name: macOS release watch

# Polls Apple's release feed once a day and opens an issue when a new stable
# macOS ships. There is no push/webhook from Apple, so polling is the only
# option; detection lags a release by up to a day.
#
# NOTE: GitHub disables scheduled workflows on public repositories after 60
# days without commits. If this stops firing, re-enable it from the Actions tab
# (or run it once with "Run workflow").

on:
  schedule:
    - cron: "0 0 * * *" # 09:00 JST
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Apple's release feed
        id: check
        run: python3 .github/scripts/os_watch.py

      - name: Open an issue
        if: steps.check.outputs.has_news == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "${{ steps.check.outputs.title }}" \
            --body-file os-watch-issue.md

      - name: Record the versions we have seen
        if: steps.check.outputs.has_news == 'true' || steps.check.outputs.seeded == 'true'
        run: |
          rm -f os-watch-issue.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/os-watch-state.json
          git diff --cached --quiet && exit 0
          git commit -m "os-watch: record latest macOS releases"
          git push
